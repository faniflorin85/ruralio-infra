###############################################################################
# ruralio-https.conf — Config complet HTTPS cu headere de securitate
# Activ dupa ce Certbot a obtinut certificatul Let's Encrypt.
###############################################################################

# HTTP -> HTTPS redirect (pastreaza /.well-known/ pentru reinnoiri Certbot)
server {
    listen 80;
    server_name ruralio.ro www.ruralio.ro;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ruralio.ro$request_uri;
    }
}

# www -> non-www redirect (HTTPS)
server {
    listen 443 ssl http2;
    server_name www.ruralio.ro;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ruralio.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruralio.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://ruralio.ro$request_uri;
}

# Server principal HTTPS
server {
    listen 443 ssl http2;
    server_name ruralio.ro;
    server_tokens off;

    # --- Certificate Let's Encrypt -------------------------------------------
    ssl_certificate /etc/letsencrypt/live/ruralio.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruralio.ro/privkey.pem;

    # --- Configuratie TLS moderna (Mozilla Intermediate) ---------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Headere de securitate -----------------------------------------------

    # HSTS: browsere sa foloseasca HTTPS timp de 2 ani, inclusiv subdomenii
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Impiedica afisarea site-ului in iframe-uri (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Impiedica browserul sa "ghiceasca" tipul fisierelor (MIME sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Trimite referrer doar catre origini HTTPS
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dezactiveaza acces la camera, microfon, geolocatie
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — adaptat la resursele folosite de site:
    # - Google Fonts (fonts.googleapis.com, fonts.gstatic.com)
    # - Imagini Unsplash (images.unsplash.com)
    # - Stiluri si scripturi inline (folosite in index.html)
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # --- Fisiere site --------------------------------------------------------
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache pentru fisiere statice (imagini, fonturi etc.) — 1 an
    # Nota: fara add_header aici, headerele de securitate de mai sus sunt mostenite
    location ~* \.(jpg|jpeg|png|gif|webp|jfif|css|js|ico|svg|woff|woff2)$ {
        expires 1y;
    }
}
