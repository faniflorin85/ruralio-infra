###############################################################################
# ruralio-http.conf — Config HTTP initial (folosit inainte de obtinerea SSL)
# Certbot foloseste /.well-known/ pentru validarea domeniului.
###############################################################################

server {
    listen 80;
    server_name ruralio.ro www.ruralio.ro;
    server_tokens off;

    root /var/www/html;
    index index.html;

    # Necesar pentru validarea HTTP-01 a Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
