###############################################################################
# deploy.yml — Pipeline CI/CD pentru Ruralio
#
# Pe Pull Request  -> ruleaza `terraform plan` (doar verifica, nu aplica)
# Pe push in main  -> ruleaza `terraform apply` + deploy site pe server
###############################################################################
name: Deploy Ruralio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite rularea manuala din tab-ul Actions (util pentru re-deploy
  # dupa recrearea instantei EC2, fara a fi nevoie de un commit nou)
  workflow_dispatch:

# Necesar pentru autentificarea OIDC catre AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: ./terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.tf_output.outputs.instance_ip }}
    env:
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_github_repo: faniflorin85/ruralio-infra
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configureaza credentialele AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Inlocuieste <ACCOUNT_ID> cu Account ID-ul tau (332241527149)
          role-to-assume: arn:aws:iam::332241527149:role/ruralio-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Instaleaza Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # --- Pe Pull Request: doar PLAN (nu modifica nimic) ---
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      # --- Pe push in main (sau rulare manuala): APPLY ---
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Citeste IP-ul instantei
        id: tf_output
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

  # --- Job separat: copiaza site-ul pe server, dupa ce infra e gata ---
  deploy-site:
    name: Deploy Site
    needs: terraform
    runs-on: ubuntu-latest
    # Ruleaza la push in main sau la rulare manuala (nu pe PR)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Asteapta SSH sa fie disponibil
        run: |
          echo "Asteptam SSH la ${{ needs.terraform.outputs.instance_ip }}:22 (max 8 minute)..."
          for i in $(seq 1 48); do
            if nc -z -w 5 "${{ needs.terraform.outputs.instance_ip }}" 22 2>/dev/null; then
              echo "SSH disponibil dupa $((i * 10)) secunde. Asteptam 20s pentru stabilizare..."
              sleep 20
              exit 0
            fi
            echo "Incercare $i/48..."
            sleep 10
          done
          echo "EROARE: SSH nu a devenit disponibil in 8 minute."
          exit 1

      - name: Copiaza fisierele site-ului pe server (SCP)
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "site/*"
          target: "/tmp/ruralio-site"
          strip_components: 1

      - name: Copiaza configuratia Nginx (SCP)
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/*"
          target: "/tmp/ruralio-nginx"
          strip_components: 1

      - name: Deploy site, Nginx si SSL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DOMAIN="ruralio.ro"
            EMAIL="faniflorin85@gmail.com"

            # 1. Deploy fisiere site
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/ruralio-site/* /var/www/html/

            # 2. Activeaza config Nginx HTTP (necesar pentru validarea Certbot)
            sudo cp /tmp/ruralio-nginx/ruralio-http.conf /etc/nginx/sites-available/ruralio.conf
            sudo ln -sf /etc/nginx/sites-available/ruralio.conf /etc/nginx/sites-enabled/ruralio.conf
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

            # 3. Obtine certificat SSL daca nu exista deja
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "Obtinem certificat SSL pentru $DOMAIN..."
              if sudo certbot certonly --webroot -w /var/www/html \
                  --non-interactive --agree-tos --email "$EMAIL" \
                  -d "$DOMAIN" -d "www.$DOMAIN"; then
                echo "Certificat SSL obtinut cu succes."
              else
                echo "ATENTIE: Certbot a esuat. DNS-ul pentru $DOMAIN nu este inca configurat."
                echo "Configureaza inregistrarile A la registrar si re-ruleaza pipeline-ul."
                exit 0
              fi
            else
              echo "Certificat SSL existent — verificam reinnoire..."
              sudo certbot renew --quiet
            fi

            # 4. Activeaza config HTTPS complet (cu headere de securitate)
            sudo cp /tmp/ruralio-nginx/ruralio-https.conf /etc/nginx/sites-available/ruralio.conf
            sudo nginx -t && sudo systemctl reload nginx
            echo "HTTPS activ pe https://$DOMAIN"
